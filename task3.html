<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Validation</title>
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="task1.html">Assignment 4</a>
    <ul class="navbar-nav flex-row flex-wrap">

      <li class="nav-item"><a class="nav-link me-3" href="index.html">Validation</a></li>
      <li class="nav-item"><a class="nav-link me-3" href="task2.html">Bootstrap form</a></li>
      <li class="nav-item"><a class="nav-link me-3" href="task3.html">Bootstrap validation</a></li>
      <li class="nav-item"><a class="nav-link" href="task4.html">Registration</a></li>
    </ul>
  </div>
</nav>
<div class="container mt-3">
<h1>Bootstrap Validation Styles</h1>
<form id="form" novalidate>
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" required>
    <div class="valid-feedback">Looks good!</div>
    <div class="invalid-feedback">Name is required</div>
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email address</label>
    <input type="email" class="form-control" id="email" required>
    <div class="valid-feedback">Looks good!</div>
    <div class="invalid-feedback">Email is required</div>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
<script>
  const form = document.getElementById("form");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    form.querySelectorAll("input").forEach(function (input) {
      input.classList.remove("is-valid", "is-invalid");
      input.classList.add(input.checkValidity() ? "is-valid" : "is-invalid");
    });
  });
</script>
</body>
</html>
