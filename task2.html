<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="task1.html">Assignment 4</a>
    <ul class="navbar-nav flex-row flex-wrap">
      <li class="nav-item"><a class="nav-link me-3" href="index.html">Validation</a></li>
      <li class="nav-item"><a class="nav-link me-3" href="task2.html">Bootstrap form</a></li>

    </ul>

<div class="container mt-3">
<h1>Bootstrap Form Styling</h1>
<form>
  <div class="row">
    <div class="col-12 col-md-6 mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" placeholder="Your name">
    </div>
    <div class="col-12 col-md-6 mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" placeholder="name@astanait.edu.com">
      <div class="form-text">We will never share your email.</div>
    </div>
  </div>
  <div class="mb-3">
    <label for="message" class="form-label">Message</label>
    <textarea class="form-control" id="message" rows="3" placeholder="Write your message"></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>

</body>
</html>
